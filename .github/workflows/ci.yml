name: ConCloud checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: [54322:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4.2-alpine
        ports: [6387:6379]
    env:
      DATABASE_URL: postgresql://concloud_runtime:local_dev_only@localhost:54322/postgres?schema=concloud
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:54322/postgres?schema=concloud
      DISPATCHER_DATABASE_URL: postgresql://concloud_dispatcher:local_dispatcher_only@localhost:54322/postgres
      REDIS_URL: redis://localhost:6387
      DEMO_MODE: 'true'
      REQUIRE_STAFF_MFA: 'true'
      LOCAL_SIGNING_SECRET: ci-synthetic-only-not-production-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: cp .env.example .env
      - run: npm run db:generate && npm run db:migrate && npm run local:roles && npm run db:seed
      - run: npm run typecheck && npm run lint && npm test && npm run build
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: |
          export LOCAL_STORAGE_DIR="$GITHUB_WORKSPACE/.local/storage"
          npm run dev > /tmp/concloud-web.log 2>&1 &
          npm run worker > /tmp/concloud-worker.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3100/api/health && break; sleep 1; done
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-evidence
          path: |
            test-results
            playwright-report
