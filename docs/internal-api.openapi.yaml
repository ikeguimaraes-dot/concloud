openapi: 3.1.0
info:
  title: ConCloud Internal Opening API
  version: 1.1.0
  description: Equipe ativa, login com senha (AAL1 ou AAL2) e escopo do escritório ConCloud. Respostas privadas sem cache.
servers:
  - url: /api/internal/v1
security:
  - operatorToken: []
paths:
  /me:
    get:
      summary: Identidade validada e permissões efetivas
      responses:
        '200':
          {
            description: user (id,
            email,
            name),
            permissions (readAll,
            documents,
            assign,
            admin),
            office,
          }
        '401': { description: Token inválido }
        '403': { description: Equipe inativa/sem concessão }
  /staff:
    get:
      summary: Responsáveis elegíveis visíveis ao administrador
      responses:
        '200': { description: items com userId e displayName }
        '403': { description: Sem permissão de atribuição }
  /leads:
    get:
      summary: Cadastros persistidos incluindo DRAFT e não pagos, sob RLS
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 120 } }
        - {
            name: plan,
            in: query,
            schema: { type: string, enum: [mei, essencial, gestao, proximo] },
          }
        - {
            name: status,
            in: query,
            schema: { type: string, enum: [DRAFT, NEW, CONTACTED, QUALIFIED, CLOSED] },
          }
        - {
            name: paymentStatus,
            in: query,
            schema:
              {
                type: string,
                enum: [PENDING, WAITING, IN_ANALYSIS, PAID, DECLINED, CANCELED, EXPIRED],
              },
          }
        - { name: ownerId, in: query, schema: { type: string }, description: UUID ou unassigned }
        - { name: cursor, in: query, schema: { type: string } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 25 },
          }
      responses:
        '200': { description: 'items, nextCursor e observedAt; ordem createdAt DESC, id DESC' }
        '422': { description: Filtros ou cursor inválidos }
  /leads/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Ficha com campos captados, cobrança inicial, responsável e últimos 30 eventos
      responses:
        '200':
          {
            description: 'Campos de OpeningLead permitidos, version e events; sem token de draft ou URLs de checkout',
          }
        '404': { description: Não encontrado ou fora do escopo }
  /leads/{id}/assignment:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Atribuição persistida com versão otimista e auditoria atômica
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ownerId, expectedVersion]
              properties:
                ownerId: { type: [string, 'null'], format: uuid }
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        '200': { description: id, ownerId e nova version }
        '409': { description: Conflito concorrente, atualizar ficha }
        '422': { description: Responsável inválido ou fora da equipe }
  /leads/{id}/documents:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Documentos atuais, revisão vigente e vínculo da versão aos sócios
      responses:
        '200': { description: 'items (id, kind, filename, mime, size, uploadedAt), submittedAt' }
        '403': { description: Sem concessão documental }
  /leads/{id}/documents/{documentId}/download:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Autoriza objeto privado e registra concessão de download
      responses:
        '200': { description: url assinada por 60 segundos e expiresAt }
        '404': { description: Arquivo não encontrado ou fora do escopo }
  /processes:
    get:
      summary: 'Quadro paginado e busca de cliente; items, nextOffset, workflows, returns'
      parameters:
        - name: workflow
          in: query
          schema: { type: string, enum: ['', MEI, JUCESP, TRIAGE], default: '' }
          description: Vazio retorna todos os fluxos.
        - name: search
          in: query
          schema: { type: string, maxLength: 120 }
          description: Nome, e-mail, CPF ou ID do processo; filtro literal antes da paginação e sujeito a RLS.
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, maximum: 100000, default: 0 }
      responses:
        '200': { description: Resultado autorizado e persistido }
        '403': { description: Sem concessão }
        '404': { description: Fora de escopo ou inexistente }
        '409': { description: Versão concorrente }
        '422': { description: Dados ou requisitos pendentes }
    post:
      deprecated: true
      summary: 'Compatibilidade: retorna processo existente; novos pagamentos são encaminhados automaticamente'
      responses:
        '200': { description: Resultado autorizado e persistido }
        '403': { description: Sem concessão }
        '404': { description: Fora de escopo ou inexistente }
        '409': { description: Versão concorrente }
        '422': { description: Dados ou requisitos pendentes }
  /processes/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: 'Processo, etapas, tarefas, comprovantes e últimos 100 eventos'
      responses:
        '200': { description: Resultado autorizado e persistido }
        '403': { description: Sem concessão }
        '404': { description: Fora de escopo ou inexistente }
        '409': { description: Versão concorrente }
        '422': { description: Dados ou requisitos pendentes }
  /processes/{id}/transitions:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: 'Transição com targetStage, expectedVersion, situation, reason, checked, protocol, cnpj e mode (manual ou drag)'
      responses:
        '200': { description: Resultado autorizado e persistido }
        '403': { description: Sem concessão }
        '404': { description: Fora de escopo ou inexistente }
        '409': { description: Versão concorrente }
        '422': { description: Dados ou requisitos pendentes }
  /processes/{id}/tasks:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: 'Tarefa com title e dueAt nullable; responsável do cadastro'
      responses:
        '200': { description: Resultado autorizado e persistido }
        '403': { description: Sem concessão }
        '404': { description: Fora de escopo ou inexistente }
        '409': { description: Versão concorrente }
        '422': { description: Dados ou requisitos pendentes }
  /processes/{id}/tasks/{taskId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: 'Conclusão/reabertura com completed e expectedVersion'
      responses:
        '200': { description: Resultado autorizado e persistido }
        '403': { description: Sem concessão }
        '404': { description: Fora de escopo ou inexistente }
        '409': { description: Versão concorrente }
        '422': { description: Dados ou requisitos pendentes }
  /processes/{id}/evidence:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: 'Upload privado JSON com kind, filename, mime e data base64; máximo 2 MB decodificados'
      responses:
        '200': { description: Resultado autorizado e persistido }
        '403': { description: Sem concessão }
        '404': { description: Fora de escopo ou inexistente }
        '409': { description: Versão concorrente }
        '422': { description: Dados ou requisitos pendentes }
  /processes/{id}/evidence/{evidenceId}/download:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: evidenceId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: 'Download auditado do comprovante'
      responses:
        '200': { description: Resultado autorizado e persistido }
        '403': { description: Sem concessão }
        '404': { description: Fora de escopo ou inexistente }
        '409': { description: Versão concorrente }
        '422': { description: Dados ou requisitos pendentes }
  /leads/{id}/documents/{documentId}/reviews:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: 'Revisão com versionId, expectedReviewId nullable, decision APPROVED ou REJECTED e reason'
      responses:
        '200': { description: Resultado autorizado e persistido }
        '403': { description: Sem concessão }
        '404': { description: Fora de escopo ou inexistente }
        '409': { description: Versão concorrente }
        '422': { description: Dados ou requisitos pendentes }
  /leads/{id}/documents/{documentId}/versions:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: 'Até 100 versões e revisões do documento, sem objectKey'
      responses:
        '200': { description: Resultado autorizado e persistido }
        '403': { description: Sem concessão }
        '404': { description: Fora de escopo ou inexistente }
        '409': { description: Versão concorrente }
        '422': { description: Dados ou requisitos pendentes }
  /leads/{id}/documents/{documentId}/versions/{versionId}/download:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: 'Download auditado da versão selecionada'
      responses:
        '200': { description: Resultado autorizado e persistido }
        '403': { description: Sem concessão }
        '404': { description: Fora de escopo ou inexistente }
        '409': { description: Versão concorrente }
        '422': { description: Dados ou requisitos pendentes }
components:
  securitySchemes:
    operatorToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
